services:
  postgres:
    image: postgres:16-alpine
    container_name: sololedger-postgres
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sololedger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sololedger_local_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sololedger}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - sololedger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sololedger} -d ${POSTGRES_DB:-sololedger}"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: sololedger-redis
    mem_limit: 128m
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - sololedger_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  sololedger_pgdata:
  sololedger_redisdata:

